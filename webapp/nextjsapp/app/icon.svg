<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>

    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFB3"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle
    cx="256"
    cy="256"
    r="220"
    fill="none"
    stroke="url(#ring)"
    stroke-width="24"
  />

  <!-- Stream Waves -->
  <path
    d="M110 256
       C150 200, 210 200, 250 256
       C290 312, 350 312, 402 256"
    fill="none"
    stroke="#00D4FF"
    stroke-width="16"
    stroke-linecap="round"
  />

  <path
    d="M140 320
       C180 275, 225 275, 260 320
       C295 365, 340 365, 372 320"
    fill="none"
    stroke="#6C5CE7"
    stroke-width="12"
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- Play Symbol -->
  <polygon
    points="220,180 220,332 340,256"
    fill="url(#play)"
  />

  <!-- AI Node -->
  <circle cx="365" cy="150" r="18" fill="#FFD93D"/>
  <line x1="338" y1="180" x2="355" y2="163"
        stroke="#FFD93D"
        stroke-width="6"
        stroke-linecap="round"/>

  <!-- AI Node Glow -->
  <circle
    cx="365"
    cy="150"
    r="30"
    fill="#FFD93D"
    opacity="0.15"
  />
</svg>